name: Daily Content Post

on:
  schedule:
    - cron: '0 18 * * *'  # 18:00 UTC = 21:00 Turkey time (UTC+3, no DST)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = simulate only, false = actually publish'
        required: false
        default: 'true'

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run
        env:
          ACCOUNT: ${{ secrets.ACCOUNT }}
          POSTING_KEY: ${{ secrets.POSTING_KEY }}
          # Manual runs use whatever "dry_run" input you pick (defaults
          # to true, so manual testing stays safe). The daily scheduled
          # run has no input to read, so it falls through to "false"
          # and actually publishes.
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python main.py
